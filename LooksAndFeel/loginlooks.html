<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="loginfeels.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="logo">UofNoTears</div>
    </header>

    <div class="form-container">
      <h2>Login to UofNoTears</h2>

      <p class="error-message">Error message goes here</p>

      <form>
        <div>
          <label>Email Address</label>
          <input type="email" required />
        </div>

        <div>
          <label>Password</label>
          <input type="password" required />
        </div>

        <div>
          <button type="submit" class="loginbutton">Sign In</button>
        </div>
      </form>

      <button class="link-button">Continue with Google</button>
    </div>
  </body>
</html>
