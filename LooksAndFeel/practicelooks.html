<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Practice Questions</title>
    <link rel="stylesheet" href="practicefeels.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="logo">UofNoTears</div>

      <div class="header-buttons">
        <button class="profile-avatar">B</button>
        <button class="logout-btn">Logout</button>
      </div>
    </header>

    <div class="page">
      <h1>AI Generated Practice Questions</h1>
      <div class="status-row">
        <span class="solved-tag">Question Not Solved</span>
      </div>

      <div class="difficulty">
        <button>Basic</button>
        <button class="selected">Intermediate</button>
        <button>Advanced</button>
      </div>

      <div class="question">
        <h2>Question</h2>

        <p>
          A university stores students, courses and enrollments. Design a
          relational schema in Third Normal Form (3NF) and explain why your
          design satisfies 3NF.
        </p>
        <textarea class="textarea" placeholder="Type your answer here...">
1+1 = 2</textarea
        >
        <button class="submit-btn">Submit Answer</button>
      </div>

      <div class="ai-feedback">
        <h2>AI Explanation</h2>

        <p>Sign...</p>

        <p class="score">Estimated Score: 0/10</p>
      </div>
    </div>
  </body>
</html>
